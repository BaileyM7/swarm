[project]
name = "swarm"
version = "0.1.0"
description = "Wargame simulator with agent-based multi-country modeling"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  # Web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.1",
  # Data layer
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13.3",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  # Config / typing
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  # AI
  "anthropic>=0.39.0",
  "langgraph>=0.2.40",
  "langchain>=0.3.7",
  "langchain-anthropic>=0.2.4",
  "langchain-community>=0.3.5",
  # Data ingestion
  "pandas>=2.2.3",
  "pyarrow>=18.0.0",
  "dlt[postgres]>=1.3.0",
  "pyyaml>=6.0.2",
  "orjson>=3.10.11",
  # Utilities
  "python-multipart>=0.0.17",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "vcrpy>=6.0.2",
  "ruff>=0.7.3",
  "mypy>=1.13.0",
  "types-pyyaml",
  # Test infrastructure
  "fakeredis>=2.26.0",    # In-memory Redis for unit/integration tests
  "aiosqlite>=0.20.0",    # SQLite async driver for in-memory test DB
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/ai", "src/shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/ai/tests", "src/backend/tests"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
