# Fly.io configuration for Swarm backend
# Deployment target: iad (primary region)
# WebSocket support with sticky sessions enabled

app = "swarm-backend"
primary_region = "iad"

[build]
dockerfile = "docker/backend.Dockerfile"
docker_build_args = { TARGET = "prod" }

[env]
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"

[deploy]
strategy = "rolling"
release_command = "alembic upgrade head"

[[services]]
protocol = "tcp"
internal_port = 8000

[services.ports]
handlers = ["http"]
port = 80

[services.http_checks]
grace_period = "20s"
interval = "30s"
method = "GET"
path = "/healthz"
protocol = "http"
restart_limit = 3
timeout = "5s"

[[services.tcp_checks]]
grace_period = "20s"
interval = "30s"
timeout = "5s"

[services.concurrency]
hard_limit = 1000
soft_limit = 500
type = "connections"

[http_service]
# Sticky sessions for WebSocket sticky session support
internal_port = 8000

[[vm]]
cpu_kind = "shared"
cpus = 2
memory_mb = 1024

[triggers]
crons = []
