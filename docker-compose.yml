name: swarm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm_dev}
      POSTGRES_DB: ${POSTGRES_DB:-swarm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm} -d ${POSTGRES_DB:-swarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: swarm-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    container_name: swarm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm_dev}@postgres:5432/${POSTGRES_DB:-swarm}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-6}
      ARBITER_MODEL: ${ARBITER_MODEL:-claude-opus-4-6}
      AGENT_RUNNER_IMPL: ${AGENT_RUNNER_IMPL:-null}
      # Rate-limit mode: 0 = parallel agent fan-out (needs Tier 2+ / 50 RPM).
      # Set to 13 on Tier 1 (5 RPM) to serialize with 13 s pacing.
      AGENT_PACE_SECONDS: ${AGENT_PACE_SECONDS:-0}
      # Empty = all 6 action tools enabled (diplomatic, economic, info, cyber,
      # kinetic, no_action). On Tier 1 set to "information_action,cyber_action"
      # to shrink prompts.
      DISABLED_AGENT_TOOLS: ${DISABLED_AGENT_TOOLS:-}
      # Max output tokens per country-agent reply. 2048 = full rationales;
      # 512 was the Tier-1 compression fallback.
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-2048}
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      # Bare imports in the codebase are `from app.*`, `from ingest.*` (resolve
      # under /app/src/backend) and `from ai.*`, `from shared.*` (resolve under
      # /app/src). Put both on PYTHONPATH.
      PYTHONPATH: /app/src:/app/src/backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src/backend:/app/src/backend
      - ./src/ai:/app/src/ai
      - ./src/shared:/app/src/shared
    working_dir: /app/src/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    container_name: swarm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:
